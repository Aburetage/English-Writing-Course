<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — الصفحة غير موجودة | English Writing Course</title>
  <meta name="description" content="الصفحة المطلوبة غير موجودة أو تم نقلها.">
  <meta name="robots" content="noindex, follow">

  <meta name="theme-color" content="#3a9b85">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #eef4f1;
      --card: rgba(255, 255, 255, 0.88);
      --border: rgba(44, 122, 104, 0.14);
      --text: #243430;
      --muted: #61756f;
      --strong: #14231f;
      --brand: #3a9b85;
      --brand-dark: #2c7a68;
      --gradient: linear-gradient(135deg, #2c7a68, #3a9b85 55%, #7fc9b2);
      --shadow: 0 18px 45px rgba(31, 45, 51, 0.12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(127, 201, 178, 0.28), transparent 30%),
        radial-gradient(circle at bottom left, rgba(43, 108, 163, 0.16), transparent 32%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.8;
    }

    .shell {
      width: min(760px, 100%);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 44px);
      text-align: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .code {
      margin: 0;
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 900;
      line-height: 1;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      margin: 12px 0 10px;
      color: var(--strong);
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      line-height: 1.35;
    }

    p {
      margin: 0 auto 24px;
      max-width: 560px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-primary {
      color: #fff;
      background: var(--gradient);
      box-shadow: 0 10px 24px rgba(58, 155, 133, 0.28);
    }

    .btn-secondary {
      color: var(--brand-dark);
      background: rgba(58, 155, 133, 0.10);
      border: 1px solid rgba(58, 155, 133, 0.18);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .note {
      margin-top: 22px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="card">
      <p class="code">404</p>

      <h1>الصفحة غير موجودة</h1>

      <p>
        آسف، الصفحة اللي بتدور عليها مش موجودة أو تم نقلها.
        تقدر ترجع للرئيسية وتكمل رحلتك في الكورس.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="https://aburetage.github.io/English-Writing-Course/">
          🏠 العودة للرئيسية
        </a>

        <a class="btn btn-secondary" href="https://aburetage.github.io/English-Writing-Course/#roadmap">
          🗺 خريطة الرحلة
        </a>
      </div>

      <p class="note">
        English Writing Course — كورس الكتابة باللغة الإنجليزية
      </p>
    </section>
  </main>
</body>
</html>
